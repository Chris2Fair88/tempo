<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempo — Login</title>
    <meta name="description" content="Sign in to Tempo — mock scheduling for in-home music lessons." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310B981'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%99%AB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./auth.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="./">
          <span class="site-header__logo" aria-hidden="true">♫</span>
          <span class="site-header__name">Tempo</span>
        </a>
      </div>
    </header>

    <main class="auth">
      <div class="container auth__inner">
        <form id="loginForm" class="card auth__card" autocomplete="on">
          <h1 class="auth__title">Welcome back</h1>
          <p class="auth__subtitle">Sign in to your account</p>

          <label class="field">
            <span class="field__label">Email</span>
            <input class="field__input" type="email" name="email" required placeholder="you@example.com" />
          </label>

          <label class="field">
            <span class="field__label">Password</span>
            <input class="field__input" type="password" name="password" required placeholder="••••••••" />
          </label>

          <label class="field">
            <span class="field__label">Role</span>
            <select class="field__input" name="role" required>
              <option value="student">Student/Parent</option>
              <option value="teacher">Teacher</option>
              <option value="admin">Admin</option>
            </select>
          </label>

          <button class="button button--primary auth__submit" type="submit">Sign in</button>
          <p class="auth__hint">Demo only — selects role and redirects.</p>
        </form>
      </div>
    </main>

    <script src="./site.js"></script>
    <script>
      // Minimal demo auth: store role and redirect
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const role = data.get('role');
        Auth.setRole(role);
        window.location.href = Auth.routeFor(role);
      });
    </script>
  </body>
</html>
