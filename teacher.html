<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempo — Teacher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="./">
          <span class="site-header__logo" aria-hidden="true">♫</span>
          <span class="site-header__name">Tempo</span>
        </a>
      </div>
    </header>
    <main class="dash">
      <div class="container">
        <h1 class="section-title">Teacher Dashboard</h1>
        <div class="grid">
          <section class="card">
            <h2>Today</h2>
            <ul class="list" id="teacherToday"></ul>
          </section>
          <section class="card">
            <h2>Availability</h2>
            <div class="stack">
              <div>Mon 4–7p, Tue 5–8p, Thu 6–8p</div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      // Guard by role (demo)
      const role = localStorage.getItem('tempo-role');
      if (role !== 'teacher') window.location.replace('login.html');
      // Demo data
      const list = document.getElementById('teacherToday');
      list.innerHTML = `
        <li class="list__item">4:00p — Guitar with Alex (Home)</li>
        <li class="list__item">5:30p — Piano with Jamie (Home)</li>
      `;
    </script>
  </body>
</html>
