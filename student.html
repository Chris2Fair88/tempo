<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempo — Student</title>
    <meta name="description" content="Tempo student dashboard — upcoming lessons and your profile." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310B981'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%99%AB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./auth.js"></script>
    <script>
      Auth.requireRole('student');
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="./">
          <span class="site-header__logo" aria-hidden="true">♫</span>
          <span class="site-header__name">Tempo</span>
        </a>
        <div class="site-header__actions">
          <a class="button button--ghost" href="./index.html">Home</a>
          <button id="logoutBtn" class="button button--ghost" type="button">Logout</button>
        </div>
      </div>
    </header>
    <main class="dash">
      <div class="container">
        <h1 class="section-title">Student Dashboard</h1>
        <div class="grid">
          <section class="card">
            <h2>Upcoming Lessons</h2>
            <ul class="list" id="studentLessons"></ul>
          </section>
          <section class="card">
            <h2>Your Profile</h2>
            <div class="stack">
              <div><strong>Name:</strong> <span id="studentName"></span></div>
              <div><strong>Instrument:</strong> <span id="studentInstrument"></span></div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="./mockData.js"></script>
    <script src="./site.js"></script>
    <script>
      Promise.all([MockAPI.getStudentUpcomingLessons(), MockAPI.getStudentProfile()]).then(
        ([lessons, profile]) => {
          document.getElementById('studentLessons').innerHTML = lessons
            .map((item) => `<li class="list__item">${item}</li>`)
            .join('');
          document.getElementById('studentName').textContent = profile.name;
          document.getElementById('studentInstrument').textContent = profile.instrument;
        }
      );
    </script>
  </body>
</html>
